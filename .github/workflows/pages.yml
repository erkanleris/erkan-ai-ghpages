name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject GitHub Actions token
        run: sed -i "s|__GITHUB_ACTIONS_TOKEN__|${{ secrets.GHP_TOKEN }}|g" src/components/RegisterForm.tsx

      - name: Build
        run: pnpm build

      - name: Verify built output contains bundled JS
        run: |
          ls -la dist/assets/
          if [ ! -f dist/index.html ]; then echo "dist/index.html missing!"; exit 1; fi
          if grep -q '/src/main.tsx' dist/index.html; then echo "dist/index.html is NOT built (references /src/main.tsx)!"; exit 1; fi
          if ! ls dist/assets/*.js 1>/dev/null 2>&1; then echo "No bundled JS in dist/assets!"; exit 1; fi
          echo "Build verified OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger gh-pages branch deployment
        run: |
          curl -sL -X POST \
            -H "Authorization: Bearer ${{ secrets.GHP_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type": "ghpages_build_done"}' \
            "https://api.github.com/repos/${{ github.repository }}/dispatches"
        env:
          GITHUB_TOKEN: ${{ secrets.GHP_TOKEN }}
