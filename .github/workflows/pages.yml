name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject GitHub Actions token
        run: sed -i "s|__GITHUB_ACTIONS_TOKEN__|${{ secrets.GHP_TOKEN }}|g" src/components/RegisterForm.tsx

      - name: Build
        run: pnpm build

      - name: Verify built output contains bundled JS
        run: |
          ls -la dist/assets/ || { echo "No assets in dist!"; exit 1; }
          JS=$(ls dist/assets/*.js | head -1)
          echo "Built JS: $JS"
          grep -q 'dist/assets' "$JS" || { echo "JS does not reference dist/assets — build may be broken!"; exit 1; }
          grep -q 'main.tsx' dist/index.html && { echo "dist/index.html still references src/main.tsx — build broken!"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
